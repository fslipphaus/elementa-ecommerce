services:
  - type: web
    name: elementa-ecommerce-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/products
    envVars:
      - key: BASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: FREE_SHIPPING_THRESHOLD
        value: "299"
